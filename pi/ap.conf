# Fake WiFi — which physical Wi-Fi the AP uses (onboard-only while USB is parked).
# start-ap.sh reads: /etc/fake-wifi/ap.conf
#
# AP_PHYS: real interface name (wlan0, wlan1, …) or "auto".
AP_PHYS=auto

# When AP_PHYS=auto:
#   usb     — prefer a USB Wi-Fi dongle if one shows up as wlan*
#   builtin — prefer built-in (SDIO) Wi-Fi, e.g. Pi Zero 2 W onboard
#
# USB radio is parked (Sep 2026 — no dongle). start-ap.sh ignores USB prefer
# until you uncomment the USB blocks there. Keep this on builtin so a stale
# /etc/fake-wifi/ap.conf copy doesn't wait 15s for a dongle that isn't coming.
# Restore later: AP_PHYS_PREFER=usb and AP_PHYS_WAIT_SECS=15, plus those comments.
AP_PHYS_PREFER=builtin

# Seconds to wait for a USB wlan (only used if USB detect is uncommented).
# AP_PHYS_PREFER=usb
# AP_PHYS_WAIT_SECS=15
AP_PHYS_WAIT_SECS=0

# Boot-only safety delay (seconds) before fake-wifi-ap.service brings up the AP.
# Gives you a window after boot to SSH in over home Wi-Fi and abort if needed.
# Without a USB dongle, start-ap uses onboard as AP-only (home Wi-Fi drops until
# stop-ap; SSH then via 192.168.4.1). Only applied under systemd (INVOCATION_ID).
# Manual `sudo start-ap.sh` runs are instant. Set to 0 to disable.
AP_BOOT_DELAY_SECS=30

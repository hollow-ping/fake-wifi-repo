<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* Corporate auth portal theme - Clean blue/white */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e0f6da;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #189385;
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #189385;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        button:hover {
            background: #157a6d;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            margin-bottom: 0;
            text-align: left;
        }
        input.error {
            border-color: #dc3545;
        }
        .create-account-link {
            text-align: center;
            margin-top: 1rem;
            color: #666;
            font-size: 0.9rem;
        }
        .create-account-link a {
            color: #189385;
            text-decoration: none;
        }
        .create-account-link a:hover {
            text-decoration: underline;
        }
    </style>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form id="loginForm">
            <label>Playa Name:</label>
            <input type="text" id="burnerName" autocomplete="username" readonly required>
            
            <label>Password:</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
            
            <button type="submit" id="loginBtn">Login</button>
            <div id="formError" class="error-message"></div>
            
            <div class="create-account-link">
                Don't have an account? <a href="create-account/start.html">Create Account</a>
            </div>
        </form>
    </div>
    
    <script src="js/main.js"></script>
    <script>
        const RECOGNIZE_DELAY_MS = 1000;
        let autoLoginTimer = null;
        let recognizedSession = false;

        function unlockPlayaNameField() {
            if (recognizedSession) return;
            const el = document.getElementById('burnerName');
            if (!el.readOnly) return;
            el.readOnly = false;
            el.tabIndex = 0;
        }

        function cancelAutoLogin() {
            if (autoLoginTimer) {
                clearTimeout(autoLoginTimer);
                autoLoginTimer = null;
            }
        }

        async function attemptLogin({ recognized = false } = {}) {
            const burnerNameEl = document.getElementById('burnerName');
            const passwordEl = document.getElementById('password');
            const formError = document.getElementById('formError');
            const burnerName = burnerNameEl.value.trim();
            const password = passwordEl.value;

            formError.textContent = '';
            burnerNameEl.classList.remove('error');
            passwordEl.classList.remove('error');

            if (!burnerName) {
                formError.textContent = 'Please enter your Playa Name';
                burnerNameEl.classList.add('error');
                return;
            }
            if (!recognized && !password) {
                formError.textContent = 'Please enter both Playa Name and password';
                passwordEl.classList.add('error');
                return;
            }

            const valid = await verifyBurnerCookie();
            const storedName = localStorage.getItem('burnerName');
            if (valid && storedName && storedName === burnerName) {
                window.location.href = 'login-success.html';
            } else {
                formError.textContent = 'Account not found';
                burnerNameEl.classList.add('error');
                passwordEl.classList.add('error');
            }
        }

        (async function onLoad() {
            const burnerNameEl = document.getElementById('burnerName');
            const passwordEl = document.getElementById('password');
            const valid = await verifyBurnerCookie();
            const storedName = localStorage.getItem('burnerName');
            if (!valid || !storedName) {
                if (document.activeElement === burnerNameEl) burnerNameEl.blur();
                return;
            }

            recognizedSession = true;
            burnerNameEl.value = storedName;
            burnerNameEl.readOnly = true;
            burnerNameEl.tabIndex = -1;
            passwordEl.placeholder = '••••••••';

            autoLoginTimer = setTimeout(() => {
                autoLoginTimer = null;
                attemptLogin({ recognized: true });
            }, RECOGNIZE_DELAY_MS);
        })();

        const burnerNameEl = document.getElementById('burnerName');
        burnerNameEl.addEventListener('pointerdown', unlockPlayaNameField);
        burnerNameEl.addEventListener('focus', unlockPlayaNameField);
        burnerNameEl.addEventListener('input', () => {
            cancelAutoLogin();
            unlockPlayaNameField();
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            cancelAutoLogin();
            await attemptLogin({ recognized: false });
        });
    </script>
</body>
</html>

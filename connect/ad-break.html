<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect: Ad Break</title>
    <style>
        /* Corporate auth portal theme - Clean blue/white (matches create-account pages) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e0f6da;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 560px;
            width: 92%;
            text-align: center;
        }
        h1 {
            color: #189385;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
        .ad-content {
            margin: 1rem 0 0.5rem;
        }
        .ad-content img {
            display: block;
            max-width: 100%;
            max-height: 78vh;
            width: auto;
            margin: 0 auto;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #189385;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        button:hover {
            background: #157a6d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><em>BURNER-NET</em> AUTH QUEUE</h1>
        <div class="ad-content">
            <img src="../images/pdf-bubbles-ad.jpg" alt="PDF Bubbles Ad">
        </div>
        <button onclick="window.location.href='../verify/captcha.html'">Skip Ad</button>
    </div>
    <script>
        // Auto-redirect after 5 seconds
        setTimeout(() => {
            window.location.href = '../verify/captcha.html';
        }, 5000);
    </script>
</body>
</html>

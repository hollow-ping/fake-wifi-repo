<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect: queue</title>
    <style>
        /* Burner ticket queue theme - Orange/red ticket site aesthetic */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 420px;
            width: 90%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .walking-man {
            font-size: 3rem;
            margin: 0.5rem 0 1.25rem;
            display: inline-block;
            animation: spin 0.75s linear infinite;
            animation-delay: 2.5s;
            animation-fill-mode: none;
        }
        .queue-stage {
            position: relative;
            width: 100%;
            margin: 0 auto 1rem;
            padding-top: 3.5rem;
            overflow: visible;
        }
        .progress-bar {
            width: 100%;
            height: 28px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #fff3e0 0%, #ffffff 100%);
            border-radius: 14px;
            transition: width 0.45s ease-out;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
        }
        .queue-number {
            position: absolute;
            top: 0;
            left: 0;
            transform: translateX(-50%);
            font-size: 3rem;
            font-weight: bold;
            line-height: 1;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.35);
            transition: left 0.45s ease-out, transform 0.45s ease-out;
            white-space: nowrap;
        }
        .queue-number.past-bar {
            left: 100%;
            transform: translateX(12px);
            color: #ffe082;
        }
        .status {
            font-size: 1.2rem;
            margin-top: 1rem;
            min-height: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><em>BURNER-NET</em> AUTH QUEUE</h1>
        <div class="walking-man">🚶</div>

        <div class="queue-stage">
            <div class="queue-number" id="queueNum">#1406</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="status" id="status">Estimated wait: 14 minutes...</div>
    </div>
    <script>
        const queueNumEl = document.getElementById('queueNum');
        const progressFill = document.getElementById('progressFill');
        const statusEl = document.getElementById('status');

        const startNum = Math.floor(Math.random() * 2000) + 1000;
        const waitMins = Math.max(3, Math.round(startNum / 100));

        function updateUI(num, advance, pastBar) {
            queueNumEl.textContent = '#' + num;
            queueNumEl.classList.toggle('past-bar', pastBar);
            progressFill.style.width = advance + '%';
            if (!pastBar) {
                queueNumEl.style.left = advance + '%';
            }
        }

        updateUI(startNum, 10, false);
        statusEl.textContent = 'Estimated wait: ' + waitMins + ' minutes...';

        const steps = [
            { num: 40, advance: 52, status: 'Moving up in line...', delay: 1000 },
            { num: 5, advance: 78, status: 'Almost at the front...', delay: 400 },
            { num: 1, advance: 96, status: 'You are next!', delay: 200 },
            { num: -1, advance: 100, past: true, status: 'Connecting...', delay: 450, hold: 2200 }
        ];

        let t = 0;
        steps.forEach((step) => {
            t += step.delay;
            setTimeout(() => {
                updateUI(step.num, step.advance, !!step.past);
                statusEl.textContent = step.status;
            }, t);

            if (step.hold) {
                t += step.hold;
                setTimeout(() => {
                    window.location.href = 'geolocate.html';
                }, t);
            }
        });
    </script>
</body>
</html>
